<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootsrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class=""container>
        <h2>User Registration</h2>
        <form action="{{url_for('register')}}" method="post">
            {% if message is defined and message %}
            <div class="alert alert-warning">
                {{message}}
            </div>
            {% endif %}
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter Name">
            </div>
            <div class="from-group">
                <label for="email">Email</label>
                <input type="email" name="email" class="from-control" placeholder="Enter Email" id="email">
                <label for="pwd">password:</label>
                <input type="password" placeholder="Enter password" name="pswd">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <p class="button">Already have an account?<a href="{{url_for('login')}}"></a></p>
        </form>
    </div>    
</body>
</html>
